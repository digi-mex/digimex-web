      - "6 TB en OneDrive (1 TB por persona)"
      - "Copilot IA incluido en Office"
      - "Apps de escritorio y móviles"
    nota: "Usuarios: hasta 6"
  - nombre: "Office 2024 Hogar"
    tipo: "Pago único"
    icono: "fa-file-word"
    destaque: false
    descripcion: "Licencia perpetua de pago único, sin renovaciones."
