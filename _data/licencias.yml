# Catálogo de licencias de Microsoft Office.
# `destaque: true` resalta el producto más vendido en la página.
licencias:
  - nombre: "Microsoft 365 Personal"
    tipo: "Suscripción anual"
    icono: "fa-user"
    destaque: false
    descripcion: "Office completo para 1 persona, siempre actualizado."
    caracteristicas:
      - "Word, Excel, PowerPoint y Outlook"
      - "1 TB de espacio en OneDrive"
      - "Copilot IA incluido en Office"
      - "Renovable cada año"
    nota: "Usuarios: 1"
  - nombre: "Microsoft 365 Familia"
    tipo: "Suscripción anual"
