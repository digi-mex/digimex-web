      - "Licencia perpetua para 1 PC o Mac"
      - "Instalación y activación incluidas"
      - "Sin renovaciones anuales"
    nota: "Dispositivos: 1"
  - nombre: "Office 2024 Hogar y Empresas"
    tipo: "Pago único"
    icono: "fa-briefcase"
    destaque: false
    descripcion: "Licencia perpetua con Outlook y uso comercial."
