# Menú de navegación principal.
# Campos: title (texto), url (destino), icono (clase FontAwesome), boton (true = CTA destacado).
# Un item con `dropdown: true` agrupa a sus `items` en un submenú desplegable.
- title: "Inicio"
  url: "/"
  icono: "fa-house"
- title: "Servicios"
  icono: "fa-screwdriver-wrench"
  dropdown: true
  items:
    - title: "Reparaciones"
      url: "/#reparaciones"
      icono: "fa-screwdriver-wrench"
    - title: "Licencias Office"
      url: "/licencias-office/"
      icono: "fa-cube"
    - title: "Landing Pages"
      url: "/servicios-digitales/"
      icono: "fa-rocket"
    - title: "Portafolio Web"
      url: "/portafolio-diseno/"
      icono: "fa-laptop-code"
- title: "Tienda"
  url: "/tienda/"
  icono: "fa-store"
- title: "Blog"
  url: "/blog/"
  icono: "fa-newspaper"
- title: "Contacto"
  url: "#contacto"
  icono: "fa-comments"
  boton: true
