name: Sincronizar contenido (Google Sheets / Docs)

on:
  schedule:
    # Cada 6 horas: revisa si hay artículos o entradas nuevas.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar y generar contenido
        run: node scripts/sync-content.js

      - name: Confirmar cambios si los hay
        run: |
          git config user.name "digimex-sync-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
            exit 0
          fi
          git commit -m "sync: actualiza tienda y blog desde Google [skip ci]"
          git push origin HEAD:main
